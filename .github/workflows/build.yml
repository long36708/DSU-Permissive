name: Build & Static Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 允许上传/下载产物
permissions:
  contents: read

jobs:
  # 公开 CI 能确定性跑通的部分：loader 编译 + 脚本静态检查 + 单元测试 +
  # 产物校验（用 fake_module.S 顶替真实 KO，验证 loader 与 verify 逻辑）。
  static-check:
    name: Loader build & static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm ripgrep shellcheck python3

      - name: Run static checks & tests
        run: |
          set -euo pipefail
          bash -x tests/static-check.sh

      - name: Upload loader artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsuinit
          path: loader/dsuinit
          if-no-files-found: error

  # 为每个 DDK target 用公开内核源码树交叉编译 dsu_permissive.ko。
  # 内核版本按 target 去重（5.10/5.15 被两个 target 共用）。
  module:
    name: Module ${{ matrix.ddk_target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ddk_target: android12-5.10
            kernel_ref: v5.10
          - ddk_target: android13-5.10
            kernel_ref: v5.10
          - ddk_target: android13-5.15
            kernel_ref: v5.15
          - ddk_target: android14-5.15
            kernel_ref: v5.15
          - ddk_target: android14-6.1
            kernel_ref: v6.1
          - ddk_target: android15-6.6
            kernel_ref: v6.6
          - ddk_target: android16-6.12
            kernel_ref: v6.12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm gcc-aarch64-linux-gnu python3

      - name: Cache kernel tree
        id: kcache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/linux-${{ matrix.kernel_ref }}
          key: kernel-${{ matrix.kernel_ref }}

      - name: Clone kernel tree
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$KERNEL_REF" \
            https://github.com/torvalds/linux.git \
            "$RUNNER_TEMP/linux-$KERNEL_REF"
        env:
          KERNEL_REF: ${{ matrix.kernel_ref }}

      - name: modules_prepare
        if: steps.kcache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/linux-${{ matrix.kernel_ref }}
        run: |
          set -euo pipefail
          make ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- \
            defconfig modules_prepare -j"$(nproc)"

      - name: Build module
        env:
          KDIR: ${{ runner.temp }}/linux-${{ matrix.kernel_ref }}
          DDK_TARGET: ${{ matrix.ddk_target }}
          # 公开内核树只做了 modules_prepare，没有完整编译，因此缺
          # Module.symvers。这些未解析符号（_printk、kern_path 等）在真机
          # 内核里都正常导出，设为 warn 让 modpost 降级处理、正常产出可加载
          # 的 .ko，而不是因缺符号表而失败。
          KBUILD_MODPOST_WARN: "1"
        run: |
          set -euo pipefail
          make module \
            KDIR="$KDIR" \
            ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- \
            DSU_DDK_TARGET="$DDK_TARGET"
          mv -f out/dsu_permissive.ko \
            "out/dsu_permissive-$DDK_TARGET.ko"
          ls -l "out/dsu_permissive-$DDK_TARGET.ko"

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsu_permissive-${{ matrix.ddk_target }}.ko
          path: out/dsu_permissive-${{ matrix.ddk_target }}.ko
          if-no-files-found: error

  # 汇总全部 KO + loader + 官方静态 magiskboot，生成设备端可执行的
  # dsu-permissive-android-flasher.sh。
  flasher:
    name: Package android flasher
    needs: [module, static-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm curl unzip ripgrep python3

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Assemble out/ directory
        run: |
          set -euo pipefail
          mkdir -p out
          ART="$RUNNER_TEMP/artifacts"
          # loader：在下载产物树中查找名为 dsuinit 的文件
          mapfile -t loaders < <(find "$ART" -type f -name dsuinit)
          if [ "${#loaders[@]}" -eq 0 ]; then
            echo "错误：未找到 dsuinit 产物" >&2
            exit 1
          fi
          install -m 0755 "${loaders[0]}" out/dsuinit
          # 全部 KO：查找 dsu_permissive-<target>.ko
          mapfile -t kofiles < <(find "$ART" -type f -name 'dsu_permissive-*.ko')
          if [ "${#kofiles[@]}" -eq 0 ]; then
            echo "错误：未找到任何 dsu_permissive-*.ko 产物" >&2
            exit 1
          fi
          for ko in "${kofiles[@]}"; do
            tgt=${ko##*/}                 # dsu_permissive-<target>.ko
            tgt=${tgt%.ko}                # dsu_permissive-<target>
            tgt=${tgt#dsu_permissive-}    # <target>
            install -m 0644 "$ko" "out/dsu_permissive-$tgt.ko"
          done
          ls -l out/

      - name: Build flasher script
        run: |
          set -euo pipefail
          tools/generate-android-flasher.sh \
            --target auto \
            --loader out/dsuinit \
            --module-dir out \
            --output out/dsu-permissive-android-flasher.sh
          chmod 0755 out/dsu-permissive-android-flasher.sh
          ls -l out/dsu-permissive-android-flasher.sh

      - name: Upload flasher artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsu-permissive-android-flasher
          path: out/dsu-permissive-android-flasher.sh
          if-no-files-found: error
